name: Reporte de error
description: Informa de un comportamiento incorrecto.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué ocurre y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Node.js y de PostgreSQL.
  - type: textarea
    id: logs
    attributes:
      label: Registros o capturas
      render: shell
