name: Propuesta de mejora
description: Sugiere una funcionalidad o un cambio.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: Qué quieres resolver.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Cómo crees que debería resolverse y qué alternativas has considerado.
    validations:
      required: true
