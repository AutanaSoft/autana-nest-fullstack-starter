version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 6 es la versión que declaran `@nestjs/cli` (dependencia) y `@nestjs/schematics`, `@nestjs/swagger` y
      # `@thallesp/nestjs-better-auth` (peer). Un salto mayor se hace a mano, para todo el repositorio a la vez, cuando
      # esos paquetes lo admitan.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
